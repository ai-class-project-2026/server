[project]
name = "teamplmate-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "pyjwt",
    "pwdlib[argon2]",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
ml = [
    "anthropic>=2.8.0",
]
onnx = [
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "ml/common"]
testpaths = ["backend/tests"]

[tool.ruff]
src = ["backend", "ml/common"]
extend-exclude = ["backend/migrations"]
